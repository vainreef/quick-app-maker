<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__APP_NAME__</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app" v-cloak>
    <header class="hero"><div><p class="eyebrow">QUICK APP MAKER</p><h1>{{ info.name }}</h1><p class="muted">源码直接运行，数据本地保存。</p></div><span class="pill">Electron {{ info.version }}</span></header>
    <section class="card">
      <label for="note">先写下一个想法</label>
      <textarea id="note" v-model="draft" placeholder="输入内容，点击保存即可验证完整闭环"></textarea>
      <div class="actions"><button class="primary" type="button" @click="save">保存</button><button type="button" @click="reload">重新读取</button><span class="status" role="status">{{ status }}</span></div>
    </section>
    <section class="card"><h2>已保存内容</h2><ul v-if="state.items.length"><li v-for="item in state.items" :key="item.id">{{ item.text }}<small>{{ item.createdAt }}</small></li></ul><p v-else class="muted">还没有内容。</p></section>
  </main>
  <script src="../../node_modules/vue/dist/vue.global.js"></script>
  <script src="./app.js"></script>
</body>
</html>
